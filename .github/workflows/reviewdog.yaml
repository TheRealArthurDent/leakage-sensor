name: 🐶 Reviewdog

on:
  pull_request:
    branches:
      - main

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Spellcheck
        uses: reviewdog/action-misspell@v1.29.0
        with:
          reporter: github-pr-review
          fail_on_error: true
          locale: US
          ignore: mosquitto

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.74.0
        with:
          reporter: github-pr-review
          fail_on_error: true

      - name: YAML lint
        uses: reviewdog/action-yamllint@v1.24.0
        with:
          reporter: github-pr-review
          fail_on_error: true

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.30.0
        with:
          reporter: github-pr-review
          fail_on_error: true
